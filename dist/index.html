.unit-art{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:cover;border-radius:4px;margin-bottom:10px}.card{min-width:0}.card b{display:block}.hero-art{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:cover;border-radius:6px;margin-bottom:14px}.hero-profile{max-width:260px;margin:0 auto 16px}.race-options{grid-template-columns:repeat(4,minmax(0,1fr))}.race-option{padding:8px}.race-option .hero-art{margin-bottom:8px}.recruit-options,.evolution-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.recruit-option{min-width:0;text-align:left}.recruit-option .unit-art{margin-bottom:8px}.recruit-option small{display:block;margin-top:6px}dialog{box-sizing:border-box;max-height:90dvh;overflow:auto}@media(max-width:750px){.race-options{grid-template-columns:repeat(2,minmax(0,1fr))}.card{font-size:13px}.hero-profile{max-width:220px}}@media(max-width:380px){.recruit-options,.evolution-options{grid-template-columns:1fr}}

.gear-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.gear-entry{display:flex;gap:10px;align-items:center;padding:10px;background:#222c25;border:1px solid #46503e;border-radius:6px;min-width:0;text-align:left}.gear-entry span{min-width:0;overflow-wrap:anywhere}.gear-entry small{display:block;margin-top:5px}.gear-icon{width:64px;height:64px;object-fit:contain;flex:0 0 64px;border-radius:4px}.gear-entry.empty .gear-icon{opacity:.28}.gear-entry.empty{color:#8e9a8d}@media(max-width:480px){.gear-grid{grid-template-columns:1fr}}
 .boss-card{grid-column:1/-1!important;border-color:#b58855}.boss-card .unit-art{height:240px;object-position:center 35%}.boss-preview{height:300px;object-fit:contain}.warning{padding:12px;background:#422b20;border:1px solid #b87b41;color:#ffd99a}.threatened{outline:2px solid #d68349}.status{display:block;color:#f1b981}.boss-card .bar{height:12px}.place-art{display:block;width:100%;height:210px;object-fit:cover;border-radius:6px;margin-bottom:15px}.npc-portrait{max-width:220px;margin:12px auto}.npc-portrait img{width:100%;height:auto;aspect-ratio:1;border-radius:6px}.npc-portrait figcaption{text-align:center;color:var(--gold);padding:5px}.altar-looks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.altar-looks figure{margin:10px 0}.altar-looks img{height:auto;aspect-ratio:1}.altar-looks figcaption{font-size:13px}summary{cursor:pointer;padding:10px 0}</style><link rel="stylesheet" href="expansion.css?v=10">
<header><div><small>ПОШАГОВАЯ СТРАТЕГИЯ</small><h1>Пепельные земли</h1></div><span id="date"></span></header><main id="app"></main><dialog id="modal"></dialog><script>
let defs,S,B=null,selected=null,action='attack';const races=['Люди','Нежить','Демоны','Эльфы'],symbols=['♜','☠','♨','❧'],types=['земля','враг','руины','алтарь','лагерь','поселение'],icons=['·','⚔','♜','✦','⛺','⌂'];const $=id=>document.getElementById(id);const rand=n=>Math.floor(Math.random()*n);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem('ashen-v1',JSON.stringify(S))}catch(e){note('Сохранение недоступно в этом браузере.')}}function note(t){S.log.unshift(t);S.log=S.log.slice(0,40)}function lead(){return 3+(S.talents.lead||0)}function used(){return S.units.reduce((a,u)=>a+u.size,0)}function unit(id,enemy=false){let d=defs.find(x=>x.id===id);return {...d,uid:crypto.randomUUID(),hp:30+d.level*15,max:30+d.level*15,atk:7+d.level*5,speed:roleSpeed(d.role),xp:0,enemy,dead:false}}function roleSpeed(r){return [5,8,6][r]}
function start(r){S={race:r,day:1,gold:300,pos:0,map:Array.from({length:64},(_,i)=>({type:i===0?5:rand(100)<45?0:1+rand(5),seen:false})),hero:{hp:100,max:100,mana:30,level:1,xp:0,points:0,str:5,dex:5,int:5},units:[],talents:{},bag:[{name:'Старый меч',slot:'Правая рука',bonus:2}],gear:{},potions:3,scrolls:1,quests:[],log:['Ты прибыл в пограничное поселение. Наними воинов перед выходом.']};reveal();save();render()}
function reveal(){for(let i=0;i<64;i++)if(Math.abs(i%8-S.pos%8)+Math.abs(Math.floor(i/8)-Math.floor(S.pos/8))<=1)S.map[i].seen=true}
function day(n=1){S.day+=n;for(let d=0;d<n;d++)if(S.day>1&&(S.day-d)%7===0){let i=1+rand(63),event=rand(3);if(S.map[i].boss)continue;S.map[i].type=[1,3,2][event];note(`День ${S.day-d}: ${['набег','эпидемия возле алтаря','открылись древние руины'][event]} в секторе ${i%8+1}:${Math.floor(i/8)+1}.`);if(event===1)S.map[i].plague=true}}
function move(i){if(B)return;if(Math.abs(i%8-S.pos%8)+Math.abs(Math.floor(i/8)-Math.floor(S.pos/8))!==1)return;S.pos=i;day();reveal();if(S.map[i].plague){S.units.filter(u=>u.hp>0).forEach(u=>u.hp=Math.max(1,u.hp-5));note('Эпидемия: воины потеряли по 5 здоровья.')}if(S.map[i].type===1)fight();else{save();render()}}
function art(u){return `<img class="unit-art" loading="lazy" src="assets/${u.id}.webp" alt="${esc(u.name)}" onerror="this.outerHTML='<div class=portrait>${symbols[u.race]}</div>'">`}
function heroArt(r=S.race){return `<img class="hero-art" src="assets/hero-${r}.webp" alt="Герой расы ${esc(races[r])}" width="768" height="768">`}
function card(u,click=''){return `<div class="card ${u.hp<=0?'dead':''} ${selected===u.uid?'target':''}" ${click?`onclick="${click}"`:''} style="grid-column:span ${u.size||1}">${art(u)}<b>${esc(u.name)}</b><div class=bar><i style="width:${Math.max(0,u.hp/u.max*100)}%"></i></div><small>${Math.max(0,u.hp)}/${u.max} · ур. ${u.level} · лидерство ${u.size}</small></div>`}
function render(){if(!S){$('app').innerHTML='<div class=panel><h2>Выбери свою расу</h2><p>Триста золотых. Три места лидерства. Мир, который меняется с каждым днём.</p><div class="cards race-options">'+races.map((r,i)=>`<button class="race-option" onclick="start(${i})">${heroArt(i)}${r}</button>`).join('')+'</div></div>';return}$('date').textContent=`День ${S.day} · ${S.gold} золотых`;let h=S.hero,t=S.map[S.pos];$('app').innerHTML=`<div class=row><button onclick="viewHero()">Герой и таланты ${h.points?'('+h.points+')':''}</button><button onclick="inventory()">Снаряжение</button><a href="prompts.md" download>Промпты изображений</a><button onclick="if(confirm('Начать новый мир? Текущее сохранение будет заменено.')){S=null;B=null;localStorage.removeItem('ashen-v1');render()}">Новый мир</button></div><div class=layout><section>${B?battleHTML():`<div class=panel>${placeArt(t)}<h2>Пограничье <small>· ${S.pos%8+1}:${Math.floor(S.pos/8)+1}</small></h2><p class=muted>Нажми соседнюю клетку. ♛ обозначает логово босса. Переход, бой и отдых занимают по дню.</p><div class=map>${S.map.map((t,i)=>`<button title="${t.boss?bossDefs[t.boss].name:types[t.type]}" aria-label="Сектор ${i+1}${t.seen&&t.boss?' · '+bossDefs[t.boss].name:''}" class="tile ${i===S.pos?'here':''} ${!t.seen?'fog':''}" onclick="move(${i})">${i===S.pos?'♟':t.seen?(t.boss?'♛':icons[t.type]):'?'}</button>`).join('')}</div><div class=row>${[3,4,5].includes(t.type)?'<button onclick="town()">Посетить '+types[t.type]+'</button>':''}${t.boss?'<button onclick="enterBoss()">Логово: '+bossDefs[t.boss].name+'</button>':t.type===2?'<button onclick="ruin()">Исследовать руины</button>':''}<button onclick="rest()">Отдых · 1 день</button></div></div>`}<div class=panel><h2>Отряд <small>${used()}/${lead()} лидерства · ${used()}/6 клеток</small></h2><div class=cards>${S.units.map(u=>card(u,`inspect('${u.uid}')`)).join('')||'<p class=muted>Отряд пуст. Наними воинов в поселении.</p>'}</div></div></section><aside><div class=panel><h2>${races[S.race]} · герой ${h.level}</h2>${heroArt()}<p>Здоровье ${h.hp}/${h.max}<br>Мана ${h.mana}/30<br>Опыт ${h.xp}/${h.level*35}<br>Зелья ${S.potions} · свитки ${S.scrolls}</p><p class=muted>Герой защищён от прямых атак, пока жив хотя бы один воин.</p></div><div class=panel><h3>Задания</h3>${S.quests.map(q=>`<p>${q.done?'✓':'◇'} ${q.name} · ${q.progress}/${q.goal}</p>`).join('')||'<small>Поговори с начальником поселения.</small>'}</div><div class=panel><h3>Хроника</h3><div class=log>${S.log.map(esc).join('<br>')}</div></div><small>Автосохранение в этом браузере. Баланс тестовый.</small></aside></div>`}
function modal(html){$('modal').innerHTML=html+'<div class=row><button onclick="modalClose()">Закрыть</button></div>';$('modal').showModal()}function modalClose(){$('modal').close();save();render()}
function town(){if(B)return;modal(`${placeArt(S.map[S.pos])}<h2>${types[S.map[S.pos].type]}</h2>${S.map[S.pos].type===3?altarLooks():''}<p>Золото: ${S.gold}</p><div class=row><button onclick="heal()">Лечение отряда · 20</button><button onclick="revive()">Воскресить павших · 25 за воина</button></div>${S.map[S.pos].type===5?`<h3>Найм</h3><div class=recruit-options>${defs.filter(d=>d.race===S.race&&d.level===1).map(d=>`<button class="recruit-option" onclick="hire('${d.id}')">${art(d)}${esc(d.name)}<small>80 золотых · ${d.size} лидерства</small></button>`).join('')}</div><h3>Торговля</h3>${npcArt('merchant','Торговец')}<div class=row><button onclick="buy('potion')">Зелье · 15</button><button onclick="buy('scroll')">Свиток · 30</button><button onclick="buy('gear')">Снаряжение · 35</button></div><button onclick="dialogue()">Начальник поселения</button>`:''}`)}
function pay(n){if(S.gold<n){alert('Недостаточно золота');return false}S.gold-=n;return true}function hire(id){if(used()+1>Math.min(lead(),6)){alert('Недостаточно лидерства или клеток');return}if(pay(80))S.units.push(unit(id));$('modal').close();save();render();town()}
function heal(){if(pay(20)){S.hero.hp=S.hero.max;S.units.filter(u=>u.hp>0).forEach(u=>u.hp=u.max)}modalClose()}function revive(){let dead=S.units.filter(u=>u.hp<=0);if(dead.length&&pay(dead.length*25))dead.forEach(u=>u.hp=1);modalClose()}const slots=['Тело','Голова','Ноги','Шея','Кольцо 1','Кольцо 2','Правая рука','Левая рука'];function buy(type){if(pay(type==='potion'?15:type==='scroll'?30:35)){if(type==='potion')S.potions++;else if(type==='scroll')S.scrolls++;else{let slot=slots[rand(8)];S.bag.push({name:slot.includes('рука')?'Клинок пограничья':`Реликвия: ${slot}`,slot,bonus:3})}}modalClose()}
function dialogue(){ $('modal').innerHTML=npcArt('chief','Начальник поселения')+'<h2>Начальник поселения</h2><p>«По дорогам бродят налётчики. Поможешь вернуть людям спокойствие?»</p><div class=row><button onclick="quest()">Принять: победить в 3 боях · 120 золотых</button><button onclick="rumor()">Спросить о руинах</button><button onclick="modalClose()">Уйти</button></div>'}function quest(){if(!S.quests.length)S.quests.push({name:'Безопасные дороги',goal:3,progress:0,done:false});modalClose()}function rumor(){let i=S.map.findIndex(t=>t.type===2);if(i>=0){S.map[i].seen=true;note('Начальник отметил руины на карте.')}modalClose()}
function rest(){if(B)return;day();S.hero.hp=Math.min(S.hero.max,S.hero.hp+15);S.hero.mana=30;S.units.filter(u=>u.hp>0).forEach(u=>u.hp=Math.min(u.max,u.hp+10));save();render()}function ruin(){S.map[S.pos].type=0;S.gold+=35;note('В руинах найдены 35 золотых.');fight('ruins')}
function viewHero(){if(B)return;modal(`<div class="hero-profile">${heroArt()}</div><h2>Таланты героя · очков ${S.hero.points}</h2><p>Сила ${S.hero.str} · ловкость ${S.hero.dex} · интеллект ${S.hero.int}</p><div class=talents>${['str','dex','int','lead','heal','armor','mana','crit','vamp'].map((k,i)=>`<button onclick="talent('${k}')">${['Сила','Ловкость','Интеллект','Лидерство','Лечение отряда','Стойкость','Восстановление маны','Точный удар','Поглощение жизни'][i]}<br><small>${S.talents[k]||0}/3${i>3?' · требуется 1 в '+['str','dex','int'][i%3]:''}</small></button>`).join('')}</div>`)}function talent(k){let keys=['str','dex','int','lead','heal','armor','mana','crit','vamp'],i=keys.indexOf(k);if(!S.hero.points||(S.talents[k]||0)>=3)return;if(i>3&&!(S.talents[['str','dex','int'][i%3]]))return;S.hero.points--;S.talents[k]=(S.talents[k]||0)+1;if(['str','dex','int'].includes(k))S.hero[k]++;modalClose();viewHero()}
function gearType(slot){return slot==='Тело'?'body':slot==='Голова'?'head':slot==='Ноги'?'boots':slot==='Шея'?'amulet':slot.startsWith('Кольцо')?'ring':'weapon'}
function gearArt(slot){return `<img class="gear-icon" loading="lazy" src="assets/gear-${gearType(slot)}.webp" alt="${esc(slot)}" width="64" height="64">`}
function inventory(){if(B)return;modal('<h2>Экипировка</h2><div class=gear-grid>'+slots.map(slot=>{let g=S.gear[slot];return `<div class="gear-entry ${g?'':'empty'}">${gearArt(slot,g)}<span><b>${esc(slot)}</b><small>${g?esc(g.name)+' · +'+g.bonus+(g.rarity?' · '+g.rarity:''):'Пусто'}</small></span></div>`}).join('')+'</div><h3>Рюкзак</h3><div class=gear-grid>'+S.bag.map((g,i)=>`<button class="gear-entry" onclick="equip(${i})">${gearArt(g.slot,g)}<span>${esc(g.name)}<small>+${g.bonus} · ${g.rarity||'Обычный'} · ${esc(g.slot)} · надеть</small></span></button>`).join('')+'</div>')}
function equip(i){let g=S.bag.splice(i,1)[0],old=S.gear[g.slot];S.gear[g.slot]=g;if(old)S.bag.push(old);modalClose();inventory()}
function inspect(uid){if(B)return;let u=S.units.find(u=>u.uid===uid);modal(`<h2>${esc(u.name)}</h2><div class="hero-profile">${art(u)}</div><p>Атака ${u.atk} · инициатива ${u.speed} · опыт ${u.xp}/20</p>${u.level<3&&u.xp>=20?'<div class=evolution-options>'+defs.filter(d=>d.parent===u.id).map(d=>`<button class="recruit-option" onclick="evolve('${uid}','${d.id}')">${art(d)}${esc(d.name)}<small>${d.size} лидерства</small></button>`).join('')+'</div>':'<p>Эволюция открывается за 20 опыта. Максимальный уровень – 3.</p>'}`)}function evolve(uid,id){let u=S.units.find(u=>u.uid===uid),d=defs.find(d=>d.id===id);if(u.hp<=0){alert('Сначала воскреси воина');return}if(used()-u.size+d.size>Math.min(lead(),6)){alert('Для этой формы нужны дополнительные лидерство и клетки');return}Object.assign(u,d,{max:30+d.level*15,hp:30+d.level*15,atk:7+d.level*5,xp:u.xp-20});modalClose()}
const neutralKinds=[{id:'mob-raider',name:'Разбойник'},{id:'mob-wolf',name:'Пепельный волк'},{id:'mob-spider',name:'Могильный паук'},{id:'mob-golem',name:'Осколочный голем'}];
function neutralEnemy(){let kind=neutralKinds[rand(neutralKinds.length)],u={...unit('0-0',true),id:kind.id,name:kind.name,neutral:true};stats(u);return u;}
function heroActor(){return {uid:'hero',name:'Герой',speed:5+S.hero.dex,hp:S.hero.hp,hero:true}}function fight(location){let enemies=Array.from({length:Math.min(3,1+Math.floor(S.day/15))},()=>location==='ruins'?ruinEnemy():rand(2)?neutralEnemy():unit(`${(S.race+1)%4}-${rand(3)}`,true));B={enemies,queue:[],current:null,flee:null,round:0,ruinLoot:location==='ruins'};round();render();advance()}function allies(){return S.units.filter(u=>u.hp>0).concat(B.summon&&B.summon.hp>0?[B.summon]:[])}function living(){return allies().concat(S.hero.hp>0?[heroActor()]:[],B.enemies.filter(u=>u.hp>0))}function round(){B.round++;B.queue=living().sort((a,b)=>b.speed-a.speed).map(u=>u.uid);if(S.talents.heal)allies().forEach(u=>u.hp=Math.min(u.max,u.hp+S.talents.heal*2));S.hero.mana=Math.min(30,S.hero.mana+(S.talents.mana||0))}function actor(id){if(id==='hero')return heroActor();return living().find(u=>u.uid===id)}function check(){if(S.hero.hp<=0){S.units=[];S.hero.hp=S.hero.max;S.hero.mana=30;S.pos=0;day(30);note('Герой погиб. Через 30 дней он вернулся в поселение. Отряд утрачен.');B=null;save();render();return true}if(!B.enemies.some(u=>u.hp>0)){bossReward();ruinReward();S.gold+=40;S.map[S.pos].type=0;S.units.filter(u=>u.hp>0).forEach(u=>u.xp+=12);S.hero.xp+=20;if(S.hero.xp>=S.hero.level*35){S.hero.xp-=S.hero.level*35;S.hero.level++;S.hero.points++;S.hero.max+=10}S.quests.forEach(q=>{if(!q.done&&++q.progress>=q.goal){q.done=true;S.gold+=120;note('Задание выполнено: +120 золотых.')}});day();note('Победа: +40 золотых, опыт героя и выживших воинов.');B=null;save();render();return true}return false}
function attackValue(u){if(!u.hero)return u.atk;return 8+S.hero.str+Object.values(S.gear).reduce((a,g)=>a+g.bonus,0)}function damage(u,n){if(u.hero){S.hero.hp=Math.max(0,S.hero.hp-Math.max(1,n-(S.talents.armor||0)*2))}else u.hp=Math.max(0,u.hp-n)}function frontline(arr){let occupied=0,front=[];for(let u of arr){if(occupied<3&&u.hp>0)front.push(u);occupied+=u.size||1}return front.length?front:arr.filter(u=>u.hp>0)}function healers(){allies().filter(u=>u.role===2).forEach(u=>{let t=allies().sort((a,b)=>a.hp/a.max-b.hp/b.max)[0];if(t){t.hp=Math.min(t.max,t.hp+Math.ceil((5+u.level*2)*(t.cursed?0.5:1)));note(`${u.name} лечит ${t.name}.`)}})}
function advance(){if(!B||check())return;let a;while(!a){if(!B.queue.length)round();a=actor(B.queue.shift())}B.current=a.uid;let st=statusStore(a);if(st.burning){st.burning--;damage(a,6);note(a.name+': горение · 6 урона.');if(check())return;if((a.hero?S.hero.hp:a.hp)<=0){advance();return}}if(st.cursed)st.cursed--;if(st.slow)st.slow--;if(st.stunned){st.stunned--;note(a.name+' пропускает ход: оглушение.');advance();return}if(a.enemy){setTimeout(()=>{if(!B)return;if(a.boss){bossTurn(a)}else{let targets=frontline(S.units);if(B.summon?.hp>0)targets.push(B.summon);let t=targets.length?targets[rand(targets.length)]:heroActor();if(rand(5)===0){living().filter(x=>!x.enemy).forEach(x=>damage(x,5));note(`${a.name}: массовая атака.`)}else{damage(t,a.atk);note(`${a.name} атакует ${t.name}: ${a.atk}.`)}}if(check())return;if(B.flee!==null){B.flee--;healers();if(B.flee<=0){day();note('Отряд завершил отступление. Выжившие и павшие возвращены с героем.');B=null;save();render();return}}render();advance()},350)}else if(B.flee!==null){if(a.role===2)healers();advance()}render()}
function battleHTML(){let a=actor(B.current);return `<div class="panel battle"><h2>Бой · раунд ${B.round}</h2><p class=gold>${B.flee!==null?'Отступление: осталось действий врагов '+B.flee:'Ход: '+(a?.name||'…')}</p><h3>Враг</h3><div class=cards>${B.enemies.map(u=>card(u,`target('${u.uid}')`)).join('')}</div><h3>Твой строй · передний ряд сверху</h3><div class=cards>${S.units.map(u=>card(u,`target('${u.uid}')`)).join('')}${B.summon?card(B.summon,`target('${B.summon.uid}')`):''}</div><p>Герой действует отдельно от строя: ${S.hero.hp}/${S.hero.max} здоровья.</p><div class=row>${a&&!a.enemy&&B.flee===null?`<button onclick="action='attack'">Атака → выбери врага</button><button onclick="special()">${a.hero?'Заклинание · 8 маны':'Особая способность'}</button>${a.hero?'<button onclick="potion()">Зелье → герой</button><button onclick="summon()">Призыв</button>':''}<button onclick="guard()">Защита</button>`:''}<button onclick="flee()" ${B.flee!==null?'disabled':''}>Бежать · 2 действия врагов</button></div><small>Ближний бой атакует передний ряд. Стрелки могут выбирать задний.</small></div>`}
function target(id){if(!B||B.flee!==null)return;let a=actor(B.current),t=actor(id);if(!a||a.enemy||!t||!t.enemy)return;if(!a.hero&&a.role===0&&!frontline(B.enemies).some(x=>x.uid===id)){note('Передний ряд защищает эту цель.');render();return}let n=attackValue(a);if(S.talents.crit&&rand(100)<S.talents.crit*15)n*=2;damage(t,n);if(a.hero&&S.talents.vamp)S.hero.hp=Math.min(S.hero.max,S.hero.hp+S.talents.vamp*2);note(`${a.name} атакует ${t.name}: ${n}.`);advance()}
function special(){if(!B)return;let a=actor(B.current);if(!a||a.enemy||B.flee!==null)return;if(a.hero){if(S.hero.mana<8)return;S.hero.mana-=8;B.enemies.filter(u=>u.hp>0).forEach(u=>damage(u,8+S.hero.int));note('Герой применил волну магии.')}else if(a.role===2){healers()}else{let t=frontline(B.enemies)[0];damage(t,Math.floor(a.atk*1.5));note(a.name+' применяет усиленный удар.')}advance()}
function potion(){if(B.current!=='hero'||!S.potions||B.flee!==null)return;S.potions--;S.hero.hp=Math.min(S.hero.max,S.hero.hp+(S.hero.cursed?20:40));advance()}function summon(){if(B.current!=='hero'||!S.scrolls||B.flee!==null||B.summon?.hp>0)return;if(used()>=6){note('Для призыва нужна свободная клетка.');render();return}S.scrolls--;B.summon=unit(`${S.race}-0`);B.summon.name='Призванный страж';advance()}function guard(){let a=actor(B.current);if(!a||a.enemy||B.flee!==null)return;if(a.hero)S.hero.hp=Math.min(S.hero.max,S.hero.hp+5);else a.hp=Math.min(a.max,a.hp+5);note(a.name+' восстанавливает 5 здоровья.');advance()}function flee(){if(!B||B.flee!==null)return;B.flee=2;note('Началось отступление.');if(!actor(B.current)?.enemy)advance();render()}
const bossDefs={
 knight:{id:'boss-knight',name:'Проклятый рыцарь',max:180,atk:18,speed:5,place:'Склеп в глубине руин',reward:{name:'Проклятый клинок',slot:'Правая рука',bonus:6,rarity:'Редкий',image:'gear-weapon'}},
 giant:{id:'boss-giant',name:'Пепельный великан',max:250,atk:22,speed:4,place:'Выжженная каменоломня',reward:{name:'Доспех пепельного великана',slot:'Тело',bonus:7,rarity:'Редкий',image:'rare-armor'}},
 dragon:{id:'boss-dragon',name:'Пепельный дракон',max:340,atk:26,speed:6,place:'Драконье логово',reward:{name:'Око пепельного дракона',slot:'Шея',bonus:10,rarity:'Артефакт',image:'artifact-eye'}}
};
function ensureBosses(){
 if(!S)return;S.defeatedBosses??=[];if(S.bossMapVersion)return;
 ['knight','giant','dragon'].forEach((k,n)=>{if(S.defeatedBosses.includes(k)||S.map.some(t=>t.boss===k))return;let i=[27,46,63][n];if(i===S.pos||S.map[i].boss)i=S.map.findIndex((t,j)=>j>15&&j!==S.pos&&!t.boss&&t.type===0);if(i<0)return;Object.assign(S.map[i],{type:2,boss:k,seen:true});});S.bossMapVersion=1;save();
}
function makeBoss(k){let d=bossDefs[k];return {...unit('0-0',true),...d,hp:d.max,boss:k,level:3,size:3,turns:0,phase:false,intent:null};}
function enterBoss(){if(B)return;let k=S.map[S.pos].boss;if(!k)return;let d=bossDefs[k];modal(`<h2>${d.name}</h2><img class="boss-preview" src="assets/${d.id}.webp" alt="${d.name}"><p>${d.place}. Здоровье: ${d.max} · атака: ${d.atk}.</p><p>Мощные атаки готовятся один ход. Защита уменьшает следующий полученный урон вдвое.</p><p>Первая победа: ${d.reward.rarity.toLowerCase()} «${d.reward.name}».</p><button onclick="beginBoss()">Начать бой</button>`);}
function beginBoss(){if(B)return;let k=S.map[S.pos].boss;if(!k)return;$('modal').close();B={enemies:[makeBoss(k)],queue:[],current:null,flee:null,round:0,bossKey:k};round();render();advance();}
function statusStore(u){return u.hero?S.hero:u;}
function statusLabel(u){let s=statusStore(u);return [s.burning?'Горение '+s.burning:'',s.stunned?'Оглушение':'',s.cursed?'Проклятие '+s.cursed:'',s.slow?'Инициатива снижена':'',s.guarded?'Защита':''].filter(Boolean).join(' · ');}
function bossTargets(kind){let a=allies(),f=frontline(S.units).concat(B.summon?.hp>0?[B.summon]:[]);if(!a.length)return [heroActor()];if(kind==='rear'){let back=a.filter(u=>!f.some(v=>v.uid===u.uid));return [(back.length?back:a)[0]];}if(kind==='single')return [f[0]||a[0]];if(kind==='all')return a;return f.slice(0,kind==='cleave'?2:6);}
function bossTurn(u){
 if(u.hp<=u.max/2&&!u.phase){u.phase=true;note(u.name+': вторая фаза!');}
 if(u.boss==='knight'&&u.phase&&!u.consumed){let s=B.enemies.find(v=>v.bossSummon&&v.hp>0);if(s){s.hp=0;u.hp=Math.min(u.max,u.hp+60);u.consumed=true;u.intent=null;note('Рыцарь поглощает скелета: +60 здоровья.');return;}}
 if(u.intent){let p=u.intent;u.intent=null;let targets=p.targets.map(actor).filter(Boolean);let power=Math.round(u.atk*(u.phase?(u.boss==='giant'?1.4:1.25):1));
 targets.forEach(t=>{damage(t,power);let s=statusStore(t);if(p.effect==='burn')s.burning=Math.max(s.burning||0,2);if(p.effect==='stun')s.stunned=1;if(p.effect==='curse')s.cursed=2;if(p.effect==='slow')s.slow=2;});note(`${u.name}: ${p.name} · ${power} урона каждой живой цели.`);u.turns++;return;}
 if(u.boss==='knight'&&u.turns%3===1&&!B.enemies.some(v=>v.bossSummon&&v.hp>0)){let s=unit('1-0',true);Object.assign(s,{name:'Призванный скелет',hp:35,max:35,atk:9,bossSummon:true});B.enemies.push(s);u.turns++;note('Рыцарь призывает скелета.');return;}
 let moves=u.boss==='knight'?[['Размашистый удар','cleave',''],['Проклятый удар','single','curse']]:u.boss==='giant'?[['Удар по переднему ряду','front',''],['Бросок камня','rear',''],['Тяжёлый удар','single','stun']]:[['Огненное дыхание','front','burn'],['Удар крыльями','all','slow']];
 let m=moves[u.turns%moves.length],targets=bossTargets(m[1]);u.intent={name:m[0],effect:m[2],targets:targets.map(t=>t.uid)};note(`${u.name} готовит «${m[0]}». Цели: ${targets.map(t=>t.name).join(', ')}. Удар на следующем ходу босса.`);
}
const originalRender=render;
render=function(){ensureBosses();originalRender();if(!S||B)return;let t=S.map[S.pos];if(t.boss){let b=$('app').querySelector?.('button[onclick="ruin()"]');if(b){b.textContent='Логово: '+bossDefs[t.boss].name;b.setAttribute('onclick','enterBoss()');}}};
const originalRuin=ruin;ruin=function(){if(S.map[S.pos].boss){enterBoss();return;}originalRuin();};
const originalCard=card;
card=function(u,click=''){let s=statusLabel(u),threat=B?.enemies.some(e=>e.hp>0&&e.intent?.targets.includes(u.uid));let html=originalCard(u,click);html=html.replace('class="card ',`class="card ${u.boss?'boss-card ':''}${threat?'threatened ':''}`);return html.replace('</div><small>',`</div>${s?'<small class="status">'+s+'</small>':''}<small>`);};
const originalBattleHTML=battleHTML;
battleHTML=function(){let warnings=B.enemies.filter(u=>u.hp>0&&u.intent).map(u=>`<p class="warning">⚠ ${esc(u.name)}: ${esc(u.intent.name)} на следующем ходу. Цели: ${u.intent.targets.map(id=>actor(id)?.name||'павшая цель').map(esc).join(', ')}.</p>`).join('');return originalBattleHTML().replace('<h3>Враг</h3>',warnings+'<h3>Враг</h3>').replace('Герой действует отдельно от строя:',`Герой ${statusLabel(heroActor())?'('+statusLabel(heroActor())+')':''} действует отдельно от строя:`);};
const originalDamage=damage;
damage=function(u,n){let s=statusStore(u);if(s.guarded){n=Math.ceil(n/2);s.guarded=false;}if(u.boss==='giant'&&u.phase)n=Math.ceil(n*1.2);originalDamage(u,n);};
guard=function(){if(!B)return;let a=actor(B.current);if(!a||a.enemy||B.flee!==null)return;statusStore(a).guarded=true;note(a.name+' защищается: следующий урон уменьшен вдвое.');advance();};
const originalRound=round;
round=function(){originalRound();B.queue=living().sort((a,b)=>(b.speed-(statusStore(b).slow?3:0))-(a.speed-(statusStore(a).slow?3:0))).map(u=>u.uid);};
function bossReward(){if(!B?.bossKey)return;let k=B.bossKey;S.defeatedBosses??=[];if(!S.defeatedBosses.includes(k)){S.defeatedBosses.push(k);S.bag.push({...bossDefs[k].reward});S.gold+=100;note(`Побеждён ${bossDefs[k].name}: +100 золотых и ${bossDefs[k].reward.name}.`);}delete S.map[S.pos].boss;S.units.forEach(u=>{delete u.burning;delete u.stunned;delete u.cursed;delete u.slow;delete u.guarded;});['burning','stunned','cursed','slow','guarded'].forEach(k=>delete S.hero[k]);}
const originalGearArt=gearArt;
gearArt=function(slot,g){return g?.image?`<img class="gear-icon" src="assets/${g.image}.webp" alt="${esc(g.name)}" width="64" height="64">`:originalGearArt(slot);};


const altarNames={neutral:'Обычный алтарь',consecrated:'Освящённый алтарь',demon:'Осквернён демонами',undead:'Осквернён нежитью'};
function placeArt(t){let n=t.type===5?'place-settlement':t.type===2?'place-ruins':t.type===3?'altar-'+(altarNames[t.altarState]?t.altarState:'neutral'):null;return n?`<img class="place-art" src="assets/${n}.webp" alt="${esc(t.type===3?altarNames[t.altarState]||altarNames.neutral:types[t.type])}">`:'';}
function npcArt(id,name){return `<figure class="npc-portrait"><img src="assets/npc-${id}.webp" alt="${esc(name)}"><figcaption>${esc(name)}</figcaption></figure>`;}
function altarLooks(){return '<details><summary>Облики алтаря</summary><div class="altar-looks">'+Object.entries(altarNames).map(([k,n])=>`<figure><img src="assets/altar-${k}.webp" alt="${n}"><figcaption>${n}</figcaption></figure>`).join('')+'</div><small>Предпросмотр изображений состояний.</small></details>';}
function ruinEnemy(){let k=rand(2),u={...unit(k?'0-0':'1-0',true),id:k?'mob-gargoyle':'mob-wraith',name:k?'Горгулья руин':'Дух руин',neutral:true};stats(u);return u;}
function ruinReward(){if(!B?.ruinLoot)return;let item=rand(4)===0?{name:'Венец забытого короля',slot:'Голова',bonus:8,rarity:'Артефакт',image:'artifact-crown'}:{name:'Янтарный посох',slot:'Правая рука',bonus:5,rarity:'Редкий',image:'rare-staff'};S.bag.push(item);note('Найдена реликвия: '+item.name+'.');}


</script><script src="expansion.js?v=10"></script><script>fetch('units.json?v=10').then(r=>{if(!r.ok)throw Error('units');return r.json()}).then(d=>{defs=d;prepareDefs();loadGame()}).catch(e=>{console.error(e);$('app').textContent='Не удалось восстановить игру. Данные сохранены. Обнови страницу или сообщи об ошибке.'});</script></html>
