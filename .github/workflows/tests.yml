name: Проверки Пепельных земель

on:
  push:
    branches:
      - main
      - "autonomy/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Проверить игровую логику
        run: npm test
      - name: Проверить целостность изображений и сформировать отчёт
        run: npm run audit
